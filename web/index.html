<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerfDog 自研工具 · 实时看板</title>
<link rel="stylesheet" href="/assets/style.css?v=42">
</head>
<body>
<header>
  <h1>性能采集 · 实时看板</h1>
  <div id="target-box">
    <label for="tb-select" class="tb-label">被测应用</label>
    <select id="tb-select" title="切换被测目标（微信小游戏 / 已安装 App / 自定义包名）"></select>
    <button id="tb-refresh" type="button" title="刷新已安装应用列表">↻</button>
    <button id="tb-stop" type="button" class="stop-btn" title="停止采集并生成报告">⏹ 停止采集</button>
    <span id="tb-status"></span>
  </div>
  <div id="status-bar">
    <span id="st-device">设备: -</span>
    <span id="st-pid">进程: -</span>
    <span id="st-run">本次: -</span>
    <span id="st-outdir" title="本次采集数据保存目录">数据: -</span>
    <span id="st-state" class="st-pill idle">未采集</span>
    <span id="st-elapsed">时长: 0s</span>
  </div>
</header>

<main>
  <div class="drag-hint">↕ 拖动卡片可调整顺序（自动记住）</div>
  <section class="chart-card">
    <div class="chart-head"><h2>FPS / Jank</h2><div id="stat-fps" class="stat-line"></div></div>
    <div id="chart-fps" class="chart"></div>
  </section>
  <section class="chart-card">
    <div class="chart-head"><h2>帧时间 (ms)</h2><div id="stat-frametime" class="stat-line"></div></div>
    <div id="chart-frametime" class="chart"></div>
  </section>
  <section class="chart-card">
    <div class="chart-head"><h2>CPU 占用</h2><div id="stat-cpu" class="stat-line"></div></div>
    <div id="chart-cpu" class="chart"></div>
  </section>
  <section class="chart-card">
    <div class="chart-head"><h2>内存 (PSS/RSS)</h2><div id="stat-mem" class="stat-line"></div></div>
    <div id="chart-mem" class="chart"></div>
  </section>
  <section class="chart-card">
    <div class="chart-head"><h2>网络流量</h2><div id="stat-net" class="stat-line"></div></div>
    <div id="chart-net" class="chart"></div>
  </section>
  <section class="chart-card">
    <div class="chart-head"><h2>电池温度 / 功率</h2><div id="stat-temp" class="stat-line"></div></div>
    <div id="chart-temp" class="chart"></div>
  </section>
</main>

<footer>
  <span>自研 PerfDog · 数据仅存本地（output/*.jsonl）· <a href="/report.html">历史报告 →</a></span>
</footer>

<script src="/assets/echarts.min.js?v=42"></script>
<script src="/assets/app.js?v=42"></script>
<script>
(function () {
  var charts = { fps: null, frametime: null, cpu: null, mem: null, net: null, temp: null };
  var startedAt = null;
  var rows = [];
  var pollTimer = null;
  var currentTarget = null;   // 当前被测目标 {package, process_pattern}
  var appList = [];           // 已安装应用缓存
  var cores = null;           // 设备核数（/api/status），供 CPU 图"进程占整机%"曲线

  function init() {
    charts.fps = window.PerfCharts.makeChart('chart-fps');
    charts.frametime = window.PerfCharts.makeChart('chart-frametime');
    charts.cpu = window.PerfCharts.makeChart('chart-cpu');
    charts.mem = window.PerfCharts.makeChart('chart-mem');
    charts.net = window.PerfCharts.makeChart('chart-net');
    charts.temp = window.PerfCharts.makeChart('chart-temp');
    initTarget();
    refreshStatus();
    window.PerfCharts.initSortable('main');
    setInterval(refreshStatus, 2000);
    // 先拉一次已采集的数据做初始渲染，再开启 SSE 实时流
    fetch('/api/latest').then(function (r) { return r.json(); }).then(function (data) {
      if (data && data.length) { rows = data; render(); }
      startStream();
    }).catch(function () { startStream(); });
  }

  function render() {
    if (!rows.length) return;
    window.PerfCharts.renderAll(charts, rows);
    window.PerfCharts.updateStats(charts, rows);
    if (startedAt) {
      var secs = Math.round((rows[rows.length - 1].t_ms || 0) / 1000);
      document.getElementById('st-elapsed').textContent = '时长: ' + secs + 's';
    }
  }

  function startStream() {
    // SSE 优先（毫秒级推流）；不支持或断开自动降级为 1s 轮询
    if (typeof EventSource === 'undefined') { pollTimer = setInterval(poll, 1000); return; }
    var es = new EventSource('/api/stream');
    es.onmessage = function (e) {
      try {
        var row = JSON.parse(e.data);
        rows.push(row);
        if (rows.length > 300) rows = rows.slice(-300);
        render();
      } catch (err) {}
    };
    es.onerror = function () {
      es.close();
      if (!pollTimer) pollTimer = setInterval(poll, 1000);
    };
  }

  function poll() {
    fetch('/api/latest').then(function (r) { return r.json(); }).then(function (data) {
      if (data && data.length) { rows = data; render(); }
    }).catch(function () {});
  }

  function refreshStatus() {
    fetch('/api/status').then(function (r) { return r.json(); }).then(function (s) {
      document.getElementById('st-device').textContent = '设备: ' + (s.device || '-');
      document.getElementById('st-pid').textContent = '进程: ' + (s.pid || '-');
      document.getElementById('st-run').textContent = '本次: ' + (s.run_id || '-');
      // 数据目录常驻显示（打包后改动 P0：用户随时知道数据存哪）
      document.getElementById('st-outdir').textContent = '数据: ' + (s.outdir || '-');
      var pill = document.getElementById('st-state');
      if (s.running) {
        pill.className = 'st-pill running';
        pill.textContent = '采集中';
        startedAt = s.started_at ? new Date('1970-01-01T' + s.started_at + 'Z') : null;
      } else {
        pill.className = 'st-pill idle';
        pill.textContent = '已停止';
        startedAt = null;
      }
      // 同步被测目标（采集器启动默认目标 / 其它端切换都会反映到这里）
      var pkg = s.target;
      var pat = s.process_pattern || '';
      if (pkg && (!currentTarget || currentTarget.package !== pkg || currentTarget.process_pattern !== pat)) {
        currentTarget = { package: pkg, process_pattern: pat };
        updateSelectValue();
      }
      // 核数：供 CPU 图"进程占整机%"派生曲线；首次拿到或发生变化时重绘一次
      var c = s.cores;
      if (c && c !== cores) {
        cores = c;
        window.PerfCharts.setCores(cores);
        render();
      }
    }).catch(function () {});
  }

  // ---------------- 被测应用下拉（方案 A 2026-08-20 / v36 就地 diff 更新） ----------------
  function initTarget() {
    // 刷新按钮显式传 force=1：服务端包列表有 60s TTL 缓存，
    // 手动刷新必须绕过缓存才能真正重新扫描（2026-08-21）
    document.getElementById('tb-refresh').onclick = function () { loadApps(true); };
    document.getElementById('tb-select').onchange = onTargetSelect;
    // 看板"停止采集"按钮（打包后改动 P0）：POST /api/stop 复用 Ctrl+C 停止路径
    document.getElementById('tb-stop').onclick = function () {
      var st = document.getElementById('tb-status');
      st.textContent = '⏹ 停止请求已发出…';
      st.className = 'tb-msg pending';
      fetch('/api/stop', { method: 'POST' }).then(function (r) { return r.json(); }).then(function (d) {
        st.textContent = d && d.ok ? '✔ 已停止' : '✘ ' + ((d && d.error) || '停止失败');
        st.className = d && d.ok ? 'tb-msg ok' : 'tb-msg err';
      }).catch(function () { st.textContent = '✘ 请求失败'; st.className = 'tb-msg err'; });
    };
    loadApps();       // 加载已装应用列表（构建下拉选项）
    loadTarget();     // 回显当前目标
  }

  function loadTarget() {
    fetch('/api/target').then(function (r) { return r.json(); }).then(function (t) {
      if (t && t.package) {
        currentTarget = { package: t.package, process_pattern: t.process_pattern || '' };
        updateSelectValue();
      }
    }).catch(function () {});
  }

  var appListOld = null;   // 上次应用列表快照（就地 diff 用，v36）

  function loadApps(force) {
    var sel = document.getElementById('tb-select');
    var st = document.getElementById('tb-status');
    // v36 无感刷新：轮询/解析刷新不再清空下拉重建（这是"左右横跳"主因），
    // 只对变化的选项做就地 diff；仅首次/手动刷新显示提示
    if (appListOld === null || force) {
      st.textContent = force ? '刷新应用列表…' : '加载应用列表…';
      st.className = 'tb-msg pending';
    }
    // force=true（仅刷新按钮传入）→ ?force=1 绕过服务端 60s 包列表缓存
    fetch('/api/device-apps' + (force ? '?force=1' : '')).then(function (r) { return r.json(); }).then(function (d) {
      appList = (d && d.apps) || [];
      rebuildSelect();
      if (d && d.resolving) {
        // 后台正在解析应用名（首次较慢，adb 串行）→ 提示并轮询自动刷新
        st.textContent = '⏳ 应用名解析中…（自动刷新）';
        st.className = 'tb-msg pending';
        clearTimeout(loadApps._timer);
        loadApps._timer = setTimeout(loadApps, 3000);
      } else if (d && d.ok) {
        if (appListOld === null || force) { st.textContent = ''; st.className = 'tb-msg'; }
        else if (st.className === 'tb-msg pending' || st.className === 'tb-msg warn') { st.textContent = ''; st.className = 'tb-msg'; }
      } else {
        st.textContent = '⚠ ' + (d && d.error || '无设备');
        st.className = 'tb-msg warn';
      }
    }).catch(function () {
      if (appListOld === null) rebuildSelect();
      st.textContent = '⚠ 应用列表加载失败';
      st.className = 'tb-msg warn';
    });
  }

  // 选项显示文本："中文名 (包名)" 或 包名
  function optText(a) {
    var label = (a && a.label) || (a && a.pkg) || '';
    return (label !== a.pkg) ? label + ' (' + a.pkg + ')' : label;
  }

  function ensureInstalledGroup(sel) {
    // 找"已安装应用"组；无则创建（首次全量重建时调用）
    for (var i = 0; i < sel.children.length; i++) {
      var c = sel.children[i];
      if (c.tagName === 'OPTGROUP' && c.label.indexOf('已安装') >= 0) return c;
    }
    var g = document.createElement('optgroup');
    g.label = '已安装应用（点选即测）';
    var customOpt = sel.querySelector('option[value="__custom__"]');
    if (customOpt) sel.insertBefore(g, customOpt);
    else sel.appendChild(g);
    return g;
  }

  function rebuildSelect() {
    var sel = document.getElementById('tb-select');
    if (appListOld === null) {
      // 首次：全量构建（预设组 + 已安装组 + 自定义项）
      var html = '';
      html += '<optgroup label="预设">';
      html += '<option value="mm">微信小游戏 (com.tencent.mm)</option>';
      html += '</optgroup>';
      sel.innerHTML = html;
      var g = ensureInstalledGroup(sel);
      for (var i = 0; i < appList.length; i++) {
        var o = document.createElement('option');
        o.value = appList[i].pkg;
        o.setAttribute('data-pkg', appList[i].pkg);
        o.textContent = optText(appList[i]);
        g.appendChild(o);
      }
      var co = document.createElement('option');
      co.value = '__custom__';
      co.textContent = '自定义包名…';
      sel.appendChild(co);
    } else {
      // 就地 diff（v36）：只增删改变化的选项，DOM 与选中态保持稳定
      var group = ensureInstalledGroup(sel);
      var newMap = {};
      for (var i = 0; i < appList.length; i++) newMap[appList[i].pkg] = appList[i];
      var opts = group.querySelectorAll('option[data-pkg]');
      var seen = {};
      for (var i = 0; i < opts.length; i++) {
        var o = opts[i];
        var p = o.getAttribute('data-pkg');
        if (!newMap[p]) { o.remove(); continue; }       // 消失项删除
        seen[p] = true;
        var t = optText(newMap[p]);
        if (o.textContent !== t) o.textContent = t;     // label 变化项更新文本
      }
      // 新增项按 pkg 字典序插入正确位置
      var pkgs = Object.keys(newMap).filter(function (p) { return !seen[p]; }).sort();
      for (var i = 0; i < pkgs.length; i++) {
        var no = document.createElement('option');
        no.value = pkgs[i];
        no.setAttribute('data-pkg', pkgs[i]);
        no.textContent = optText(newMap[pkgs[i]]);
        var inserted = false;
        for (var j = 0; j < group.children.length; j++) {
          var op = group.children[j];
          if (op.tagName === 'OPTION' && (op.getAttribute('data-pkg') || '') > pkgs[i]) {
            group.insertBefore(no, op); inserted = true; break;
          }
        }
        if (!inserted) group.appendChild(no);
      }
    }
    appListOld = appList.slice();
    updateSelectValue();
  }

  function updateSelectValue() {
    var sel = document.getElementById('tb-select');
    if (!sel || !currentTarget || !currentTarget.package) { sel.value = ''; return; }
    var p = currentTarget.package;
    // 微信小游戏：预设项（带 appbrand 进程模式）
    if (p === 'com.tencent.mm' && (currentTarget.process_pattern || '') === 'appbrand') {
      sel.value = 'mm';
      return;
    }
    var found = appList.some(function (a) { return a.pkg === p; });
    if (found) { sel.value = p; return; }
    // 自定义 / 不在已装列表：临时加一个"当前"项回显
    var cur = sel.querySelector('option[value="__cur__"]');
    if (!cur) {
      cur = document.createElement('option');
      cur.value = '__cur__';
      sel.appendChild(cur);
    }
    cur.textContent = '当前: ' + p + (currentTarget.process_pattern ? '（' + currentTarget.process_pattern + '）' : '');
    sel.value = '__cur__';
  }

  function onTargetSelect() {
    var sel = document.getElementById('tb-select');
    var v = sel.value;
    if (v === '__cur__' || !v) { updateSelectValue(); return; }
    if (v === '__custom__') {
      var pkg = window.prompt('输入被测应用包名（如 com.example.game）：');
      if (!pkg || !pkg.trim()) { updateSelectValue(); return; }
      doSwitchTarget(pkg.trim(), '');
      return;
    }
    if (v === 'mm') { doSwitchTarget('com.tencent.mm', 'appbrand'); return; }
    doSwitchTarget(v, '');
  }

  function doSwitchTarget(pkg, pat) {
    var st = document.getElementById('tb-status');
    st.textContent = '切换中…';
    st.className = 'tb-msg pending';
    fetch('/api/switch-target?package=' + encodeURIComponent(pkg) +
          '&process_pattern=' + encodeURIComponent(pat || ''), { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.ok) {
          st.textContent = '✔ ' + (d.message || '已切换');
          st.className = 'tb-msg ok';
          currentTarget = { package: pkg, process_pattern: pat || '' };
          // 清空实时数据重画：新目标从零开始
          rows = [];
          Object.keys(charts).forEach(function (k) { if (charts[k]) charts[k].clear(); });
          updateSelectValue();
        } else {
          st.textContent = '✘ ' + (d.error || '切换失败');
          st.className = 'tb-msg err';
          updateSelectValue();
        }
      })
      .catch(function () {
        st.textContent = '✘ 请求失败';
        st.className = 'tb-msg err';
        updateSelectValue();
      });
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  init();
})();
</script>
</body>
</html>
